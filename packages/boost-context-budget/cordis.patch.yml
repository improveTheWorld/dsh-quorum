# Budget de contexte : 'context_occupancy' expose l'occupation, et 'subagent_fork'
# est refuse au-dela du seuil 'forkThresholdRatio' (defaut 0,6).
#
# Niveau HOST, et c'est une condition de fonctionnement, pas un detail : la ligne
# capture le service 'agents' NON scope et installe son outil DANS LA SURFACE DE
# CHAQUE AGENT depuis son listener 'agent/created'. Un outil enregistre depuis la
# portee d'une ligne atteint le service 'tools', jamais la surface composee d'un
# agent — mesure deux fois (voir 'packages/boost-mode/cordis.patch.yml:369-384')
# et repris ici : la portee d'une ligne ne voit pas l'agent. Le motif qui
# fonctionne est celui de 'packages/detached-jobs/lib/index.js:985-1026'.
#
# Le listener 'tools/pre-execute' et le listener 'turn/end' (feed
# 'session/event') restent, eux, sur cette ligne non TAGUEE : un listener sans
# tag est admis partout, un listener tague ne recoit que les evenements de sa
# portee ('dsh-scope/lib/index.js:327-337').
#
# Le fichier du preset n'est pas dans le perimetre de ce paquet.
- insert:
    # SEPTIEME LIGNE, DESARMEE le 2026-10-01 apres deux falsifications successives.
    # La mesure d'occupation a ete refutee sur la vraie pile : `prefix-usage` s'arrete au dernier
    # echantillon du fournisseur (donc AVANT les tool/result du tour clos) et la vue de surface est
    # detruite par une compaction post-frontiere — les deux vues tombent ensemble, un fork refuse a
    # 75 % passe, et l'enfant herite exactement ces 75 %. Mesure inverse aussi : 70 000 annonces pour
    # 5 tokens de surface close. La mesure doit se lire sur les EVENEMENTS du prefixe que le fork
    # tranche, pas sur une projection. En attendant : la ligne est desarmee, et les 30 cas restent
    # en place pour la reprise (docs/DECISIONS.md, choix n°9).
    - id: dsh-boost-context-budget
      disabled: true
      name: ./lib/index.js
